apiVersion: apps/v1
kind: Deployment
metadata:
  name: holderforge-backend
  namespace: holderforge
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 3
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: holderforge-backend

  template:
    metadata:
      labels:
        app: holderforge-backend

    spec:
      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: holderforge-ghcr

      containers:
        - name: backend
          image: ghcr.io/suriyanandhimalai555-prog/avg-token-backend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4002
              protocol: TCP

          envFrom:
            - secretRef:
                name: holderforge-backend-env

          env:
            - name: PORT
              value: "4002"
            - name: NODE_ENV
              value: "production"

          volumeMounts:
            - name: backend-output
              mountPath: /app/output

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

      volumes:
        - name: backend-output
          persistentVolumeClaim:
            claimName: holderforge-backend-output

---
apiVersion: v1
kind: Service
metadata:
  name: holderforge-backend
  namespace: holderforge
spec:
  type: ClusterIP

  selector:
    app: holderforge-backend

  ports:
    - name: http
      port: 4002
      targetPort: http
      protocol: TCP
