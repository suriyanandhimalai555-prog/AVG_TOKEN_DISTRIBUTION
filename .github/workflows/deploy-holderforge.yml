name: Deploy AVG Token Distribution

on:
  push:
    branches:
      - main

concurrency:
  group: holderforge-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: suriyanandhimalai555-prog
  BACKEND_IMAGE: ghcr.io/suriyanandhimalai555-prog/avg-token-backend
  FRONTEND_IMAGE: ghcr.io/suriyanandhimalai555-prog/avg-token-frontend
  NAMESPACE: holderforge

jobs:

  build-backend:
    name: "🐳 Build & Push Backend ARM64"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔐 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🚀 Build & Push Backend"
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-frontend:
    name: "🐳 Build & Push Frontend ARM64"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔐 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🚀 Build & Push Frontend"
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true

          build-args: |
            VITE_API_URL=https://api.holderforge.io

          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: "🚀 Deploy to k3s"
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🚀 Deploy to k3s"
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          WALLET_ENCRYPTION_KEY: ${{ secrets.WALLET_ENCRYPTION_KEY }}

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,WALLET_ENCRYPTION_KEY
          script_stop: true

          script: |
            set -euo pipefail

            APP_DIR="$HOME/otp/apps/AVG_TOKEN_DISTRIBUTION/combined-repo"
            NAMESPACE="holderforge"

            cd "$APP_DIR"

            echo ""
            echo "=================================================="
            echo "🚀 AVG TOKEN DISTRIBUTION DEPLOYMENT"
            echo "=================================================="
            echo "📦 Commit:   ${IMAGE_TAG}"
            echo "📁 Namespace: ${NAMESPACE}"
            echo "=================================================="
            echo ""

            rollback_deployment() {
              echo ""
              echo "=================================================="
              echo "❌ DEPLOYMENT FAILED"
              echo "🔄 STARTING AUTOMATIC ROLLBACK"
              echo "=================================================="

              if [ "${BACKEND_EXISTS}" = "yes" ]; then
                echo "🔄 Rolling back backend..."

                kubectl rollout undo \
                  deployment/holderforge-backend \
                  -n "$NAMESPACE" || true

                kubectl rollout status \
                  deployment/holderforge-backend \
                  -n "$NAMESPACE" \
                  --timeout=60s || true

                echo "✅ Backend rollback completed."
              else
                echo "🧹 Removing newly created backend deployment..."

                kubectl delete deployment holderforge-backend \
                  -n "$NAMESPACE" \
                  --ignore-not-found=true

                echo "✅ New backend deployment removed."
              fi

              if [ "${FRONTEND_EXISTS}" = "yes" ]; then
                echo "🔄 Rolling back frontend..."

                kubectl rollout undo \
                  deployment/holderforge-frontend \
                  -n "$NAMESPACE" || true

                kubectl rollout status \
                  deployment/holderforge-frontend \
                  -n "$NAMESPACE" \
                  --timeout=60s || true

                echo "✅ Frontend rollback completed."
              else
                echo "🧹 Removing newly created frontend deployment..."

                kubectl delete deployment holderforge-frontend \
                  -n "$NAMESPACE" \
                  --ignore-not-found=true

                echo "✅ New frontend deployment removed."
              fi

              echo ""
              echo "🛡️ PVC was preserved."
              echo "🛡️ Existing applications were not touched."
              echo "❌ Deployment failed and rollback was attempted."
              echo ""

              exit 1
            }

            echo "🔎 Checking Kubernetes cluster..."

            kubectl cluster-info >/dev/null

            echo "✅ Kubernetes cluster is reachable."
            echo ""

            echo "📁 Applying namespace..."

            kubectl apply -f k8s/namespace.yaml

            echo "✅ Namespace ready."
            echo ""

            echo "🔐 Updating GHCR pull secret..."

            kubectl create secret docker-registry holderforge-ghcr \
              --namespace "$NAMESPACE" \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_USERNAME" \
              --docker-password="$GHCR_TOKEN" \
              --dry-run=client \
              -o yaml | kubectl apply -f -

            echo "✅ GHCR pull secret ready."
            echo ""

            # Managed Wallets: copy the WALLET_ENCRYPTION_KEY GitHub secret into
            # holderforge-backend-env, but only when the server has no key yet.
            # An existing key is never replaced: pool seeds are encrypted with it.
            echo "🔑 Checking Managed Wallets encryption key..."

            if [ -z "${WALLET_ENCRYPTION_KEY:-}" ]; then
              echo "ℹ️ No WALLET_ENCRYPTION_KEY GitHub secret; server key left as is."
            elif ! kubectl get secret holderforge-backend-env \
              -n "$NAMESPACE" >/dev/null 2>&1; then
              echo "⚠️ Secret holderforge-backend-env not found; key not set."
            else
              CURRENT_KEY="$(kubectl get secret holderforge-backend-env \
                -n "$NAMESPACE" \
                -o jsonpath='{.data.WALLET_ENCRYPTION_KEY}' | base64 -d 2>/dev/null || true)"

              if [ -z "$CURRENT_KEY" ]; then
                # printf is a shell builtin, so the key never appears in a process list.
                printf '{"stringData":{"WALLET_ENCRYPTION_KEY":"%s"}}' "$WALLET_ENCRYPTION_KEY" \
                  | kubectl patch secret holderforge-backend-env \
                    -n "$NAMESPACE" \
                    --type merge \
                    --patch-file /dev/stdin >/dev/null
                echo "✅ WALLET_ENCRYPTION_KEY added to holderforge-backend-env."
              elif [ "$CURRENT_KEY" = "$WALLET_ENCRYPTION_KEY" ]; then
                echo "✅ WALLET_ENCRYPTION_KEY already set and matches."
              else
                echo "⚠️ holderforge-backend-env already has a DIFFERENT WALLET_ENCRYPTION_KEY."
                echo "⚠️ Not replacing it (existing pools are encrypted with it); make local backends use the server's key."
              fi

              unset CURRENT_KEY
            fi

            echo ""

            echo "💾 Checking backend persistent storage..."

            kubectl apply -f k8s/backend-storage.yaml

            echo "✅ PVC configuration applied."
            echo "🛡️ Existing PVC will NOT be deleted during rollback."
            echo ""

            BACKEND_EXISTS="no"
            FRONTEND_EXISTS="no"

            if kubectl get deployment holderforge-backend \
              -n "$NAMESPACE" >/dev/null 2>&1; then
              BACKEND_EXISTS="yes"
            fi

            if kubectl get deployment holderforge-frontend \
              -n "$NAMESPACE" >/dev/null 2>&1; then
              FRONTEND_EXISTS="yes"
            fi

            echo "🔎 Existing backend deployment:  ${BACKEND_EXISTS}"
            echo "🔎 Existing frontend deployment: ${FRONTEND_EXISTS}"
            echo ""

            # The backend keeps running scripts, SSE streams and the Managed Wallets
            # transfer worker in process, so it must run as exactly one pod. Pin any
            # autoscaler on it to 1 replica (reversible; the frontend's is untouched).
            if kubectl get hpa holderforge-backend -n "$NAMESPACE" >/dev/null 2>&1; then
              kubectl patch hpa holderforge-backend -n "$NAMESPACE" --type merge \
                -p '{"spec":{"minReplicas":1,"maxReplicas":1}}' >/dev/null
              echo "📌 Backend autoscaler pinned to 1 replica."
            fi

            echo "🚀 Applying backend deployment..."

            sed "s#__IMAGE_TAG__#${IMAGE_TAG}#g" \
              k8s/backend.yaml | kubectl apply -f -

            echo "✅ Backend manifest applied."
            echo ""

            echo "🚀 Applying frontend deployment..."

            sed "s#__IMAGE_TAG__#${IMAGE_TAG}#g" \
              k8s/frontend.yaml | kubectl apply -f -

            echo "✅ Frontend manifest applied."
            echo ""

            echo "🌐 Applying ingress..."

            kubectl apply -f k8s/ingress.yaml

            echo "✅ Ingress manifest applied."
            echo ""

            echo "=================================================="
            echo "⏳ WAITING FOR BACKEND + FRONTEND"
            echo "=================================================="

            kubectl rollout status \
              deployment/holderforge-backend \
              -n "$NAMESPACE" \
              --timeout=60s \
              > /tmp/holderforge-backend-rollout.log 2>&1 &

            BACKEND_ROLLOUT_PID=$!

            kubectl rollout status \
              deployment/holderforge-frontend \
              -n "$NAMESPACE" \
              --timeout=60s \
              > /tmp/holderforge-frontend-rollout.log 2>&1 &

            FRONTEND_ROLLOUT_PID=$!

            BACKEND_ROLLOUT_RESULT=0
            FRONTEND_ROLLOUT_RESULT=0

            wait "$BACKEND_ROLLOUT_PID" || BACKEND_ROLLOUT_RESULT=$?
            wait "$FRONTEND_ROLLOUT_PID" || FRONTEND_ROLLOUT_RESULT=$?

            echo ""
            echo "---------------- BACKEND ROLLOUT ----------------"
            cat /tmp/holderforge-backend-rollout.log || true

            echo ""
            echo "---------------- FRONTEND ROLLOUT ----------------"
            cat /tmp/holderforge-frontend-rollout.log || true

            if [ "$BACKEND_ROLLOUT_RESULT" -ne 0 ]; then
              echo "❌ Backend rollout failed."
              rollback_deployment
            fi

            if [ "$FRONTEND_ROLLOUT_RESULT" -ne 0 ]; then
              echo "❌ Frontend rollout failed."
              rollback_deployment
            fi

            echo ""
            echo "✅ Backend rollout successful."
            echo "✅ Frontend rollout successful."
            echo ""

            echo "=================================================="
            echo "🔎 CURRENT POD STATUS"
            echo "=================================================="

            kubectl get pods \
              -n "$NAMESPACE" \
              -l app=holderforge-backend \
              -o wide

            echo ""

            kubectl get pods \
              -n "$NAMESPACE" \
              -l app=holderforge-frontend \
              -o wide

            echo ""

            echo "=================================================="
            echo "❤️ BACKEND INTERNAL HEALTH"
            echo "=================================================="

            # Choose only a Running, Ready pod that is not terminating.
            select_ready_pod() {
              local label="$1"

              kubectl get pods \
                -n "$NAMESPACE" \
                -l "$label" \
                -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.deletionTimestamp}{"|"}{.status.phase}{"|"}{.status.containerStatuses[0].ready}{"\n"}{end}' \
                2>/dev/null |
                awk -F'|' '$2 == "" && $3 == "Running" && $4 == "true" {print $1; exit}' ||
                true
            }

            BACKEND_HEALTHY="no"

            for attempt in $(seq 1 10); do
              BACKEND_POD="$(select_ready_pod "app=holderforge-backend")"

              if [ -z "$BACKEND_POD" ]; then
                echo "No ready backend pod found ($attempt/10)."
                sleep 3
                continue
              fi

              echo "Backend pod: $BACKEND_POD"
              echo "Health attempt: $attempt/10"

              if kubectl --request-timeout=15s exec \
                -n "$NAMESPACE" "$BACKEND_POD" \
                -- node -e "
                  fetch('http://holderforge-backend:4002/health')
                    .then(async r => {
                      const body = await r.text();
                      console.log('HTTP status:', r.status);
                      console.log(body);
                      if (!r.ok) process.exit(1);
                    })
                    .catch(err => {
                      console.error(err);
                      process.exit(1);
                    });
                "; then
                BACKEND_HEALTHY="yes"
                break
              fi

              echo "Backend check failed; the pod may have changed. Retrying."
              sleep 3
            done

            if [ "$BACKEND_HEALTHY" != "yes" ]; then
              echo "Backend health check failed after retries."
              rollback_deployment
            fi

            echo "Backend internal health check successful."
            echo ""

            echo "=================================================="
            echo "🗄️ DATABASE MIGRATIONS"
            echo "=================================================="

            # Idempotent: applies only migrations not yet recorded in
            # schema_migrations. Non-fatal on purpose: the app runs without
            # them (Managed Wallets shows its setup checklist), so a failure
            # here is reported but never triggers a rollback.
            if kubectl --request-timeout=120s exec \
              -n "$NAMESPACE" "$BACKEND_POD" \
              -- node dist/migrate.js; then
              echo "✅ Migrations up to date."
            else
              echo "⚠️ Migration step failed; run it by hand: kubectl exec -n $NAMESPACE deploy/holderforge-backend -- node dist/migrate.js"
            fi
            echo ""
            echo "=================================================="

            echo "=================================================="
            echo "❤️ FRONTEND INTERNAL HEALTH"
            echo "=================================================="

            FRONTEND_HEALTHY="no"

            for attempt in $(seq 1 10); do
              FRONTEND_POD="$(select_ready_pod "app=holderforge-frontend")"

              if [ -z "$FRONTEND_POD" ]; then
                echo "No ready frontend pod found ($attempt/10)."
                sleep 3
                continue
              fi

              echo "Frontend pod: $FRONTEND_POD"
              echo "Frontend health attempt: $attempt/10"

              if kubectl --request-timeout=15s exec \
                -n "$NAMESPACE" "$FRONTEND_POD" \
                -- wget -q --spider http://holderforge-frontend/; then
                FRONTEND_HEALTHY="yes"
                break
              fi

              echo "Frontend check failed; the pod may have changed. Retrying."
              sleep 3
            done

            if [ "$FRONTEND_HEALTHY" != "yes" ]; then
              echo "Frontend health check failed after retries."
              rollback_deployment
            fi

            echo "Frontend internal health check successful."
            echo ""
            echo "=================================================="

            echo "🌐 EXTERNAL HTTPS INGRESS CHECK"
            echo "=================================================="

            INGRESS_OK="no"

            for i in $(seq 1 10); do

              echo "🔎 Ingress check ${i}/10..."

              if \
                curl -fsS --max-time 5 \
                  https://holderforge.io/ >/dev/null \
                && \
                curl -fsS --max-time 5 \
                  https://www.holderforge.io/ >/dev/null \
                && \
                curl -fsS --max-time 5 \
                  https://holderforge.io/health >/dev/null
              then

                INGRESS_OK="yes"

                echo ""
                echo "✅ holderforge.io is healthy."
                echo "✅ www.holderforge.io is healthy."
                echo "✅ holderforge.io/health is healthy."
                break
              fi

              if [ "$i" -lt 10 ]; then
                echo "⏳ Waiting 3 seconds..."
                sleep 3
              fi
            done

            if [ "$INGRESS_OK" != "yes" ]; then
              echo ""
              echo "❌ External HTTPS ingress health check failed."
              rollback_deployment
            fi

            echo ""
            echo "=================================================="
            echo "✅✅✅ DEPLOYMENT SUCCESSFUL ✅✅✅"
            echo "=================================================="
            echo "📦 Commit: ${IMAGE_TAG}"
            echo "📁 Namespace: ${NAMESPACE}"
            echo "🌐 https://holderforge.io"
            echo "🌐 https://www.holderforge.io"
            echo "❤️ https://holderforge.io/health"
            echo ""
            echo "✅ Backend rollout successful"
            echo "✅ Frontend rollout successful"
            echo "✅ Backend health successful"
            echo "✅ Frontend health successful"
            echo "✅ HTTPS ingress successful"
            echo "🛡️ Existing applications untouched"
            echo "🛡️ PVC preserved"
            echo "=================================================="
            echo ""

  notify-success:
    name: "✅ Send Success Notification"
    needs:
      - build-backend
      - build-frontend
      - deploy

    if: ${{ success() }}

    runs-on: ubuntu-latest

    steps:
      - name: "✅ Send success email"
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "✅ AVG Token Distribution Deployment SUCCESS"

          to: devops@avgprimetech.com,chandrashekhargawda2000@gmail.com
          from: devops@avgprimetech.com

          secure: false

          body: |
            ==================================================
            ✅ AVG TOKEN DISTRIBUTION DEPLOYMENT SUCCESS
            ==================================================

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            Status: ✅ SUCCESS

            Backend: ✅ Deployed
            Frontend: ✅ Deployed
            Kubernetes: ✅ Healthy
            Backend Health: ✅ Healthy
            Frontend Health: ✅ Healthy
            HTTPS Ingress: ✅ Healthy

            URLs:
            https://holderforge.io
            https://www.holderforge.io
            https://holderforge.io/health

            ==================================================
            ✅ Deployment completed successfully
            ==================================================

  notify-failure:
    name: "❌ Send Failure Notification"
    needs:
      - build-backend
      - build-frontend
      - deploy

    if: ${{ failure() }}

    runs-on: ubuntu-latest

    steps:
      - name: "❌ Send failure email"
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "❌ AVG Token Distribution Deployment FAILED"

          to: devops@avgprimetech.com,chandrashekhargawda2000@gmail.com
          from: devops@avgprimetech.com

          secure: false

          body: |
            ==================================================
            ❌ AVG TOKEN DISTRIBUTION DEPLOYMENT FAILED
            ==================================================

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            Status: ❌ FAILED

            The deployment workflow failed.

            Automatic rollback was attempted when applicable.

            Existing PVC:
            🛡️ Preserved

            Existing applications:
            🛡️ Not intentionally modified

            ==================================================
            ❌ Deployment failed
            ==================================================
