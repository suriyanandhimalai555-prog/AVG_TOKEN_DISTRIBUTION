name: Diagnose backend (read-only)

# Read-only: prints pod status and recent backend error lines. Never deploys.
on:
  push:
    branches:
      - diag/backend-logs

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: "🔎 Backend status and recent errors"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -u
            NS=holderforge
            echo "=== deployment replicas (spec / ready) ==="
            kubectl get deploy -n "$NS" -o custom-columns=NAME:.metadata.name,SPEC:.spec.replicas,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas
            echo "=== autoscalers ==="
            kubectl get hpa -n "$NS" -o wide 2>&1 || true
            kubectl get scaledobject -n "$NS" 2>&1 | head -5 || true
            echo "=== recent scaling / pod events ==="
            kubectl get events -n "$NS" --sort-by=.lastTimestamp 2>/dev/null | grep -iE 'scal|replica|Created pod|Killing|OOM|BackOff|Unhealthy' | tail -25
            echo "=== deployment last-applied replicas and managers ==="
            kubectl get deploy holderforge-backend -n "$NS" -o jsonpath='{.metadata.annotations.kubectl\.kubernetes\.io/last-applied-configuration}' | grep -o '"replicas":[0-9]*' || true
            kubectl get deploy holderforge-backend -n "$NS" -o jsonpath='{range .metadata.managedFields[*]}{.manager}{" "}{.operation}{" "}{.time}{"\n"}{end}'
            echo "=== errors from EVERY backend pod (last 2000 lines each) ==="
            for P in $(kubectl get pods -n "$NS" -l app=holderforge-backend -o jsonpath='{.items[*].metadata.name}'); do
              echo "----- $P -----"
              kubectl logs "$P" -n "$NS" --tail=2000 \
                | grep -iE 'error|fail|timeout|ECONN|too many|\[sessions|\[prepare\]|\[generate|\[distribute|PostgreSQL|remaining connection|terminat' \
                | grep -vE 'eth_getLogs block range rejected|at (createTSError|reportTSError|getOutput|Object|Module|Function|wrapModuleLoad|node:)' \
                | tail -40
            done
