name: Diagnose backend (read-only)

# Read-only: prints pod status and recent backend error lines. Never deploys.
on:
  push:
    branches:
      - diag/backend-logs

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: "🔎 Backend status and recent errors"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -u
            NS=holderforge
            echo "=== pods ==="
            kubectl get pods -n "$NS" -o wide
            echo "=== backend env keys (names only) ==="
            kubectl get secret holderforge-backend-env -n "$NS" -o jsonpath='{.data}' | tr ',' '\n' | sed -E 's/^\{?"([^"]+)".*/\1/' | sort
            echo "=== backend: errors, warnings and route failures (last 3000 lines) ==="
            kubectl logs deploy/holderforge-backend -n "$NS" --tail=3000 \
              | grep -iE 'error|fail|timeout|ECONN|too many|\[sessions|\[prepare|\[generate|\[distribute|\[managed\]|PostgreSQL|pool' \
              | grep -v 'eth_getLogs block range rejected' \
              | tail -150
            echo "=== backend: last 40 lines ==="
            kubectl logs deploy/holderforge-backend -n "$NS" --tail=40
            echo "=== previous container (if it restarted) ==="
            POD=$(kubectl get pods -n "$NS" -l app=holderforge-backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            [ -n "$POD" ] && kubectl logs "$POD" -n "$NS" --previous --tail=60 2>/dev/null || echo "(no previous container)"
