name: Diagnose backend (read-only)

# Read-only: prints pod status and recent backend error lines. Never deploys.
on:
  push:
    branches:
      - diag/backend-logs

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: "🔎 Backend status and recent errors"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -u
            NS=holderforge
            echo "=== pods ==="
            kubectl get pods -n "$NS"
            echo "=== session route errors with context ==="
            kubectl logs deploy/holderforge-backend -n "$NS" --tail=5000 \
              | grep -A 25 -E '\[sessions' \
              | grep -vE '^\s+at (node:|Module|Function|Object\.<anonymous>|process\.processTicksAndRejections)' \
              | tail -90
