name: Diagnose backend (read-only)

# Read-only: prints pod status and recent backend error lines. Never deploys.
on:
  push:
    branches:
      - diag/backend-logs

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: "🔎 Backend status and recent errors"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -u
            NS=holderforge
            echo "=== pods and autoscaler ==="
            kubectl get pods -n "$NS"
            kubectl get hpa holderforge-backend -n "$NS"
            echo "=== contract files Distribute loads (read-only) ==="
            kubectl exec -n "$NS" deploy/holderforge-backend -- sh -c 'cd /app && for c in MultiSender ABCToken; do node -e "const a=require(\"./artifacts/contracts/$c.sol/$c.json\"); console.log(\"$c: abi entries\", a.abi.length)"; done'
            echo "=== hardhat: anything left to compile? ==="
            kubectl exec -n "$NS" deploy/holderforge-backend -- sh -c 'cd /app && npx hardhat compile 2>&1 | grep -v "npm notice" | tail -2'
            echo "=== errors since startup ==="
            kubectl logs deploy/holderforge-backend -n "$NS" --tail=2000 \
              | grep -iE 'error|fail|\[sessions|\[prepare|\[distribute|known tokens|worker started' \
              | grep -vE 'eth_getLogs block range rejected' | tail -20
